name: HomeRelay

options:
  generateEmptyDirectories: false

packages:
  HomeRelayCore:
    path: Packages/HomeRelayCore
  HAPSwift:
    path: Packages/HAPSwift

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  HomeRelay:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "26.0"
    sources:
      - path: Sources/HomeRelay
    dependencies:
      - package: HomeRelayCore
      - package: HAPSwift
        products: [HAPApple, HAPTransport, HAPCrypto, HAPCore]
      - sdk: HomeKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOMERELAY_BUNDLE_PREFIX).homerelay
        PRODUCT_NAME: HomeRelay
        SUPPORTS_MACCATALYST: "YES"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: HomeRelay.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: "YES"
